[project]
name = "plantilla-ia"
version = "0.1.0"
description = "Plantilla para proyectos de software con IA: spec, decisiones, bitácora y evals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# El paquete se llama `app` en todos los proyectos (docs/decisiones/0003).
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite `from evals import correr` en las pruebas del arnés.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
